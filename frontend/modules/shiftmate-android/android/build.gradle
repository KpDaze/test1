plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.shiftmate'
version = '1.0.0'

android {
  namespace 'com.shiftmate.android'
  defaultConfig {
    minSdkVersion 23
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
}
