plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.shiftmate'
version = '1.0.0'

android {
  namespace 'com.shiftmate.ocr'
  defaultConfig {
    minSdkVersion 23
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled model: available offline immediately and never uploads the roster image.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
