name: Exact 13 Sep populated Home capture
on:
  push:
    branches: [capture-exact-2026-09-13]
    paths: [.github/workflows/exact-populated-home.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build exact historical source
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run typecheck
          pnpm exec expo prebuild --platform android --clean --no-install
          cd android && ./gradlew assembleRelease --stacktrace --no-daemon
      - name: Build screenshot-only database
        run: |
          python3 - <<'PY'
          import sqlite3
          p='preview-seed.db'
          db=sqlite3.connect(p)
          db.executescript("""
          PRAGMA foreign_keys=ON;
          CREATE TABLE app_meta (key TEXT PRIMARY KEY NOT NULL,value TEXT NOT NULL);
          CREATE TABLE profile (id TEXT PRIMARY KEY NOT NULL CHECK(id='singleton'),name TEXT NOT NULL DEFAULT '',default_house_id TEXT,alarm_lead_minutes INTEGER NOT NULL DEFAULT 150,pay_period_type TEXT NOT NULL DEFAULT 'week',pay_week_start_dow INTEGER NOT NULL DEFAULT 1,pay_fortnight_anchor TEXT,default_hourly_rate REAL NOT NULL DEFAULT 0);
          CREATE TABLE houses (id TEXT PRIMARY KEY NOT NULL,name TEXT NOT NULL,address TEXT NOT NULL DEFAULT '',is_default INTEGER NOT NULL DEFAULT 0,hourly_rate REAL NOT NULL DEFAULT 0,created_at TEXT NOT NULL,updated_at TEXT NOT NULL);
          CREATE TABLE roster_scans (id TEXT PRIMARY KEY NOT NULL,captured_at TEXT NOT NULL,original_uri TEXT,image_sha256 TEXT,ocr_engine TEXT NOT NULL,parser_version INTEGER NOT NULL,overall_confidence REAL,status TEXT NOT NULL,raw_ocr_json TEXT);
          CREATE TABLE shifts (id TEXT PRIMARY KEY NOT NULL,date TEXT NOT NULL,start_time TEXT NOT NULL,end_time TEXT NOT NULL,house_id TEXT,house_name TEXT NOT NULL DEFAULT '',alarm_enabled INTEGER NOT NULL DEFAULT 1,notes TEXT NOT NULL DEFAULT '',source TEXT NOT NULL DEFAULT 'manual',roster_scan_id TEXT,confidence REAL,confirmation_status TEXT NOT NULL DEFAULT 'confirmed',original_date TEXT NOT NULL,original_start_time TEXT NOT NULL,original_end_time TEXT NOT NULL,original_house_id TEXT,original_house_name TEXT NOT NULL DEFAULT '',created_at TEXT NOT NULL,updated_at TEXT NOT NULL,is_deleted INTEGER NOT NULL DEFAULT 0,FOREIGN KEY(house_id) REFERENCES houses(id) ON DELETE SET NULL,FOREIGN KEY(roster_scan_id) REFERENCES roster_scans(id) ON DELETE SET NULL);
          CREATE TABLE shift_changes (id TEXT PRIMARY KEY NOT NULL,shift_id TEXT NOT NULL,changed_at TEXT NOT NULL,change_type TEXT NOT NULL,phase TEXT NOT NULL,previous_json TEXT NOT NULL,new_json TEXT NOT NULL,previous_start TEXT NOT NULL,previous_end TEXT NOT NULL,new_start TEXT NOT NULL,new_end TEXT NOT NULL,hours_delta REAL NOT NULL,FOREIGN KEY(shift_id) REFERENCES shifts(id) ON DELETE RESTRICT);
          """)
          now='2026-09-13T23:00:00.000+10:00'
          db.execute("INSERT INTO app_meta VALUES ('schema_version','4')")
          db.execute("INSERT INTO profile VALUES ('singleton','Preview','h1',150,'fortnight',1,'2026-09-07',40.0)")
          db.executemany("INSERT INTO houses VALUES (?,?,?,?,?,?,?)",[('h1','House A','',1,40.0,now,now),('h2','House B','',0,42.0,now,now)])
          shifts=[
          ('s1','2026-09-21','07:00','19:00','h1','House A',0,'Residential care','manual',None,None,'confirmed','2026-09-21','08:00','19:00','h1','House A',now,now,0),
          ('s2','2026-09-22','07:00','19:00','h1','House A',0,'Residential care','manual',None,None,'confirmed','2026-09-22','07:00','19:00','h1','House A',now,now,0),
          ('s3','2026-09-23','19:00','07:00','h2','House B',0,'Residential care','manual',None,None,'confirmed','2026-09-23','19:00','07:00','h2','House B',now,now,0),
          ('s4','2026-09-24','19:00','07:00','h2','House B',0,'Residential care','manual',None,None,'confirmed','2026-09-24','19:00','07:00','h2','House B',now,now,0),
          ('s5','2026-09-25','07:00','15:00','h1','House A',0,'Residential care','manual',None,None,'confirmed','2026-09-25','07:00','15:00','h1','House A',now,now,0)]
          db.executemany("INSERT INTO shifts VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",shifts)
          db.execute("INSERT INTO shift_changes VALUES (?,?,?,?,?,?,?,?,?,?,?,?)",('c1','s1',now,'update','before','{"start_time":"08:00","end_time":"19:00"}','{"start_time":"07:00","end_time":"19:00"}','08:00','19:00','07:00','19:00',1.0))
          db.commit();db.close()
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run exact app, inject temporary data, capture Home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell wm size 941x1672
            adb shell wm density 350
            adb shell settings put system font_scale 1.0
            adb shell settings put system time_12_24 24
            adb install -r frontend/android/app/build/outputs/apk/release/app-release.apk
            adb shell pm clear com.shiftmate.app || true
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity
            sleep 6
            adb shell am force-stop com.shiftmate.app
            adb root
            sleep 2
            adb wait-for-device
            adb push preview-seed.db /data/local/tmp/preview-seed.db
            adb shell mkdir -p /data/user/0/com.shiftmate.app/files/SQLite
            adb shell rm -f /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db-wal /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db-shm
            adb shell 'uid=$(stat -c %u /data/user/0/com.shiftmate.app); cp /data/local/tmp/preview-seed.db /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db; chown "$uid:$uid" /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db; chmod 600 /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db; restorecon -RF /data/user/0/com.shiftmate.app/files/SQLite'
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity -a android.intent.action.VIEW -d shiftmate://calendar
            sleep 6
            adb shell input tap 118 1535
            sleep 4
            adb exec-out screencap -p > exact-populated-home.png
            test -s exact-populated-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: exact-13-sep-populated-home
          path: exact-populated-home.png
          if-no-files-found: error
          retention-days: 3
