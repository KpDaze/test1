name: Verify current-source ShiftMate Android with visible sample data

on:
  push:
    branches: [verify/current-source-android-screenshot-20260919]
    paths:
      - .github/workflows/capture-fresh-screenshots.yml

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install current-source dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Check current source
        working-directory: frontend
        run: pnpm run typecheck

      - name: Generate the current Android project
        working-directory: frontend
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build current-source Android APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Preserve current-source APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftMate-current-source-APK
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build screenshot-only sample database
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          p = Path('preview-seed.db')
          if p.exists(): p.unlink()
          db = sqlite3.connect(p)
          db.executescript('''
          PRAGMA foreign_keys = ON;
          CREATE TABLE app_meta (key TEXT PRIMARY KEY NOT NULL, value TEXT NOT NULL);
          CREATE TABLE profile (
            id TEXT PRIMARY KEY NOT NULL CHECK (id = 'singleton'), name TEXT NOT NULL DEFAULT '',
            default_house_id TEXT, alarm_lead_minutes INTEGER NOT NULL DEFAULT 150,
            pay_period_type TEXT NOT NULL DEFAULT 'week', pay_week_start_dow INTEGER NOT NULL DEFAULT 1,
            pay_fortnight_anchor TEXT, default_hourly_rate REAL NOT NULL DEFAULT 0
          );
          CREATE TABLE houses (
            id TEXT PRIMARY KEY NOT NULL, name TEXT NOT NULL, address TEXT NOT NULL DEFAULT '',
            is_default INTEGER NOT NULL DEFAULT 0, hourly_rate REAL NOT NULL DEFAULT 0,
            created_at TEXT NOT NULL, updated_at TEXT NOT NULL
          );
          CREATE TABLE roster_scans (
            id TEXT PRIMARY KEY NOT NULL, captured_at TEXT NOT NULL, original_uri TEXT,
            image_sha256 TEXT, ocr_engine TEXT NOT NULL, parser_version INTEGER NOT NULL,
            overall_confidence REAL, status TEXT NOT NULL, raw_ocr_json TEXT
          );
          CREATE TABLE shifts (
            id TEXT PRIMARY KEY NOT NULL, date TEXT NOT NULL, start_time TEXT NOT NULL,
            end_time TEXT NOT NULL, house_id TEXT, house_name TEXT NOT NULL DEFAULT '',
            alarm_enabled INTEGER NOT NULL DEFAULT 1, notes TEXT NOT NULL DEFAULT '',
            source TEXT NOT NULL DEFAULT 'manual', roster_scan_id TEXT, confidence REAL,
            confirmation_status TEXT NOT NULL DEFAULT 'confirmed', original_date TEXT NOT NULL,
            original_start_time TEXT NOT NULL, original_end_time TEXT NOT NULL,
            original_house_id TEXT, original_house_name TEXT NOT NULL DEFAULT '',
            created_at TEXT NOT NULL, updated_at TEXT NOT NULL, is_deleted INTEGER NOT NULL DEFAULT 0,
            FOREIGN KEY (house_id) REFERENCES houses(id) ON DELETE SET NULL,
            FOREIGN KEY (roster_scan_id) REFERENCES roster_scans(id) ON DELETE SET NULL
          );
          CREATE TABLE shift_changes (
            id TEXT PRIMARY KEY NOT NULL, shift_id TEXT NOT NULL, changed_at TEXT NOT NULL,
            change_type TEXT NOT NULL, phase TEXT NOT NULL, previous_json TEXT NOT NULL,
            new_json TEXT NOT NULL, previous_start TEXT NOT NULL, previous_end TEXT NOT NULL,
            new_start TEXT NOT NULL, new_end TEXT NOT NULL, hours_delta REAL NOT NULL,
            FOREIGN KEY (shift_id) REFERENCES shifts(id) ON DELETE RESTRICT
          );
          CREATE INDEX idx_shifts_date ON shifts(date);
          CREATE INDEX idx_shift_changes_shift ON shift_changes(shift_id, changed_at);
          ''')
          from datetime import date, datetime, timedelta, timezone
          today = date.today()
          dates = [(today + timedelta(days=offset)).isoformat() for offset in range(1, 7)]
          now = datetime.now(timezone.utc).isoformat()
          db.execute("INSERT INTO app_meta VALUES ('schema_version','4')")
          db.execute("INSERT INTO profile VALUES (?,?,?,?,?,?,?,?)", (
            'singleton','Preview','h1',150,'fortnight',1,today.isoformat(),40.0
          ))
          db.executemany("INSERT INTO houses VALUES (?,?,?,?,?,?,?)", [
            ('h1','House A','',1,40.0,now,now),
            ('h2','House B','',0,42.0,now,now),
          ])
          shifts = [
            ('s1',dates[0],'07:00','19:00','h1','House A',0,'Residential care','manual',None,None,'confirmed',dates[0],'08:00','19:00','h1','House A',now,now,0),
            ('s2',dates[1],'07:00','19:00','h1','House A',0,'Residential care','manual',None,None,'confirmed',dates[1],'07:00','19:00','h1','House A',now,now,0),
            ('s3',dates[2],'19:00','07:00','h2','House B',0,'Residential care','manual',None,None,'confirmed',dates[2],'19:00','07:00','h2','House B',now,now,0),
            ('s4',dates[3],'19:00','07:00','h2','House B',0,'Residential care','manual',None,None,'confirmed',dates[3],'19:00','07:00','h2','House B',now,now,0),
            ('s5',dates[4],'07:00','15:00','h1','House A',0,'Residential care','manual',None,None,'confirmed',dates[4],'07:00','15:00','h1','House A',now,now,0),
            ('s6',dates[5],'19:00','07:00','h2','House B',0,'Residential care','manual',None,None,'confirmed',dates[5],'19:00','07:00','h2','House B',now,now,0),
          ]
          db.executemany("INSERT INTO shifts VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", shifts)
          db.execute("INSERT INTO shift_changes VALUES (?,?,?,?,?,?,?,?,?,?,?,?)", (
            'c1','s1',now,'update','before',
            '{"start_time":"08:00","end_time":"19:00"}',
            '{"start_time":"07:00","end_time":"19:00"}',
            '08:00','19:00','07:00','19:00',1.0
          ))
          db.commit(); db.close()
          PY

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and capture every page
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb wait-for-device
            adb shell wm size 941x1672
            adb shell wm density 350
            adb shell settings put system font_scale 1.0
            adb shell settings put system time_12_24 24
            adb install -r frontend/android/app/build/outputs/apk/release/app-release.apk
            adb shell pm clear com.shiftmate.app || true
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity
            sleep 8
            adb exec-out screencap -p > screenshots/onboarding.png
            test -s screenshots/onboarding.png
            adb shell am force-stop com.shiftmate.app
            adb root
            sleep 2
            adb wait-for-device
            adb push preview-seed.db /data/local/tmp/preview-seed.db
            adb shell mkdir -p /data/user/0/com.shiftmate.app/files/SQLite
            adb shell rm -f /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db-wal /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db-shm
            adb shell 'uid=$(stat -c %u /data/user/0/com.shiftmate.app); cp /data/local/tmp/preview-seed.db /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db; chown "$uid:$uid" /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db; chmod 600 /data/user/0/com.shiftmate.app/files/SQLite/shiftmate.db; restorecon -RF /data/user/0/com.shiftmate.app/files/SQLite'
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity -a android.intent.action.VIEW -d shiftmate://calendar
            sleep 5
            adb shell input tap 118 1535
            sleep 4
            adb exec-out screencap -p > screenshots/home.png
            test -s screenshots/home.png
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity -a android.intent.action.VIEW -d shiftmate://calendar
            sleep 5
            adb exec-out screencap -p > screenshots/calendar.png
            test -s screenshots/calendar.png
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity -a android.intent.action.VIEW -d shiftmate://scan
            sleep 5
            adb exec-out screencap -p > screenshots/scan.png
            test -s screenshots/scan.png
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity -a android.intent.action.VIEW -d shiftmate://settings
            sleep 5
            adb exec-out screencap -p > screenshots/settings.png
            test -s screenshots/settings.png
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity -a android.intent.action.VIEW -d shiftmate://payslip
            sleep 5
            adb exec-out screencap -p > screenshots/payslip.png
            test -s screenshots/payslip.png
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -S -n com.shiftmate.app/.MainActivity -a android.intent.action.VIEW -d shiftmate://shift/s1
            sleep 5
            adb exec-out screencap -p > screenshots/shift-detail.png
            test -s screenshots/shift-detail.png
            ls -lh screenshots

      - name: Upload fresh screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShiftMate-fresh-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
