name: ShiftMate runtime Home preview

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/shiftmate-runtime-preview.yml

permissions:
  contents: read

jobs:
  runtime-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Generate Android project
        working-directory: frontend
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Build x86_64 debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace --no-daemon

      - name: Create fictional Home preview data
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          p = Path('/tmp/shiftmate.db')
          if p.exists(): p.unlink()
          db = sqlite3.connect(p)
          db.executescript('''
          PRAGMA foreign_keys = ON;
          CREATE TABLE app_meta (key TEXT PRIMARY KEY NOT NULL, value TEXT NOT NULL);
          CREATE TABLE profile (
            id TEXT PRIMARY KEY NOT NULL, name TEXT NOT NULL DEFAULT '', default_house_id TEXT,
            alarm_lead_minutes INTEGER NOT NULL DEFAULT 150,
            pay_period_type TEXT NOT NULL DEFAULT 'week', pay_week_start_dow INTEGER NOT NULL DEFAULT 1,
            pay_fortnight_anchor TEXT, default_hourly_rate REAL NOT NULL DEFAULT 0
          );
          CREATE TABLE houses (
            id TEXT PRIMARY KEY NOT NULL, name TEXT NOT NULL, address TEXT NOT NULL DEFAULT '',
            is_default INTEGER NOT NULL DEFAULT 0, hourly_rate REAL NOT NULL DEFAULT 0,
            created_at TEXT NOT NULL, updated_at TEXT NOT NULL
          );
          CREATE TABLE roster_scans (
            id TEXT PRIMARY KEY NOT NULL, captured_at TEXT NOT NULL, original_uri TEXT,
            image_sha256 TEXT, ocr_engine TEXT NOT NULL, parser_version INTEGER NOT NULL,
            overall_confidence REAL, status TEXT NOT NULL, raw_ocr_json TEXT
          );
          CREATE TABLE shifts (
            id TEXT PRIMARY KEY NOT NULL, date TEXT NOT NULL, start_time TEXT NOT NULL,
            end_time TEXT NOT NULL, house_id TEXT, house_name TEXT NOT NULL DEFAULT '',
            alarm_enabled INTEGER NOT NULL DEFAULT 1, notes TEXT NOT NULL DEFAULT '',
            source TEXT NOT NULL DEFAULT 'manual', roster_scan_id TEXT, confidence REAL,
            confirmation_status TEXT NOT NULL DEFAULT 'confirmed', original_date TEXT NOT NULL,
            original_start_time TEXT NOT NULL, original_end_time TEXT NOT NULL,
            original_house_id TEXT, original_house_name TEXT NOT NULL DEFAULT '',
            created_at TEXT NOT NULL, updated_at TEXT NOT NULL, is_deleted INTEGER NOT NULL DEFAULT 0
          );
          CREATE TABLE shift_changes (
            id TEXT PRIMARY KEY NOT NULL, shift_id TEXT NOT NULL, changed_at TEXT NOT NULL,
            change_type TEXT NOT NULL, phase TEXT NOT NULL, previous_json TEXT NOT NULL,
            new_json TEXT NOT NULL, previous_start TEXT NOT NULL, previous_end TEXT NOT NULL,
            new_start TEXT NOT NULL, new_end TEXT NOT NULL, hours_delta REAL NOT NULL
          );
          ''')
          db.execute("INSERT INTO profile VALUES (?,?,?,?,?,?,?,?)", ('singleton','Preview User','preview-house-1',150,'fortnight',1,'2026-09-07',0))
          now='2026-09-13T00:00:00.000Z'
          houses=[
            ('preview-house-1','Rivergum House','',1,0,now,now),
            ('preview-house-2','Coastal House','',0,0,now,now),
          ]
          db.executemany('INSERT INTO houses VALUES (?,?,?,?,?,?,?)', houses)
          shifts=[
            ('preview-1','2026-09-14','07:00','19:00','preview-house-1','Rivergum House',0,'','manual',None,None,'confirmed','2026-09-14','07:00','19:00','preview-house-1','Rivergum House',now,now,0),
            ('preview-2','2026-09-15','19:00','07:00','preview-house-2','Coastal House',0,'','manual',None,None,'confirmed','2026-09-15','19:00','07:00','preview-house-2','Coastal House',now,now,0),
            ('preview-3','2026-09-16','07:00','19:00','preview-house-1','Rivergum House',0,'','manual',None,None,'confirmed','2026-09-16','07:00','19:00','preview-house-1','Rivergum House',now,now,0),
            ('preview-4','2026-09-19','19:00','07:00','preview-house-2','Coastal House',0,'','manual',None,None,'confirmed','2026-09-19','19:00','07:00','preview-house-2','Coastal House',now,now,0),
          ]
          db.executemany('INSERT INTO shifts VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)', shifts)
          db.execute("INSERT INTO app_meta VALUES ('schema_version','4')")
          db.commit(); db.close()

          rk = Path('/tmp/RKStorage')
          if rk.exists(): rk.unlink()
          db = sqlite3.connect(rk)
          db.execute('CREATE TABLE catalystLocalStorage (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
          db.executemany('INSERT INTO catalystLocalStorage VALUES (?,?)', [
            ('shiftmate.theme.mode.v1','"light"'),
            ('shiftmate.theme.palette.v1','"teal"'),
            ('shiftmate.clock.format.v1','"24h"'),
          ])
          db.commit(); db.close()
          PY

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and capture Home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb root || true
            adb wait-for-device
            adb shell wm size 941x1672
            adb shell wm density 350
            adb shell settings put system font_scale 1.0
            adb shell settings put system time_12_24 24
            adb install -r frontend/android/app/build/outputs/apk/debug/app-debug.apk
            adb root || true
            adb wait-for-device
            adb push /tmp/shiftmate.db /data/local/tmp/shiftmate.db
            adb push /tmp/RKStorage /data/local/tmp/RKStorage
            adb shell mkdir -p /data/data/com.shiftmate.app/files/SQLite /data/data/com.shiftmate.app/databases
            APP_OWNER=$(adb shell stat -c '%u:%g' /data/data/com.shiftmate.app | tr -d '\r')
            adb shell cp /data/local/tmp/shiftmate.db /data/data/com.shiftmate.app/files/SQLite/shiftmate.db
            adb shell cp /data/local/tmp/RKStorage /data/data/com.shiftmate.app/databases/RKStorage
            adb shell chown "$APP_OWNER" /data/data/com.shiftmate.app/files/SQLite/shiftmate.db /data/data/com.shiftmate.app/databases/RKStorage
            adb shell am force-stop com.shiftmate.app
            adb shell monkey -p com.shiftmate.app -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
            sleep 8
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb exec-out screencap -p > shiftmate-home.png

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: ShiftMate-runtime-home-preview
          path: |
            shiftmate-home.png
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
