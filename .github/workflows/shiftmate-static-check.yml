name: ShiftMate source check

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - 'frontend/app/**'
      - 'frontend/src/**'
      - 'frontend/modules/**'
      - 'frontend/package.json'
      - '.github/workflows/shiftmate-static-check.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
