name: ShiftMate source and UI audit

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - 'frontend/app/**'
      - 'frontend/src/**'
      - 'frontend/assets/**'
      - 'frontend/modules/**'
      - 'frontend/package.json'
      - '.github/workflows/shiftmate-static-check.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Static UI audit
        shell: python
        run: |
          from pathlib import Path
          import re

          app_files = list(Path('app').rglob('*.tsx'))
          component_files = list(Path('src/components').rglob('*.tsx'))
          visible_files = app_files + component_files

          problems = []
          for path in visible_files:
              text = path.read_text()
              if 'MOCKUP_LIGHT' in text:
                  problems.append(f'{path}: direct MOCKUP_LIGHT use')
              if '👋' in text:
                  problems.append(f'{path}: wave emoji remains')
              if 'Barlow' in text or 'DM Sans' in text or 'DMSans' in text:
                  problems.append(f'{path}: unavailable font name')

          tabs = Path('app/(tabs)/_layout.tsx').read_text()
          required = {
              'name="index"': 'Home',
              'name="calendar"': 'Calendar',
              'name="scan"': 'Scan',
              'name="settings"': 'Settings',
          }
          for needle, title in required.items():
              if needle not in tabs or f'title: "{title}"' not in tabs:
                  problems.append(f'bottom navigation missing {title}')
          for forbidden in ('Timesheets', 'More'):
              if f'title: "{forbidden}"' in tabs:
                  problems.append(f'bottom navigation contains forbidden tab {forbidden}')

          home = Path('app/(tabs)/index.tsx').read_text()
          if 'dashboard-payslip-btn' not in home or 'router.push("/payslip")' not in home:
              problems.append('Home payslip action missing')
          if 'notificationDot' in home or 'notificationBadge' in home:
              problems.append('Home contains notification-dot/badge implementation')
          if 'referenceDateTileTones' in home:
              problems.append('Home owns date tones instead of design system')
          if 'dateTiles[index % dateTiles.length]' not in home:
              problems.append('Home coloured date-tile sequence not wired')
          if 'ShiftTypeBadge' not in home or 'HousePill' not in home:
              problems.append('Home shared shift primitives not wired')
          canonical_brand = 'require("../../assets/branding/shiftmate-mark-source.png")'
          if canonical_brand not in home:
              problems.append('Home canonical ShiftMate brand asset is not wired')
          if not Path('assets/branding/shiftmate-mark-source.png').exists():
              problems.append('Canonical ShiftMate brand asset is missing')

          design = Path('src/designSystem.ts').read_text()
          for color in ('#E0F1FD', '#D7F6EE', '#EEE4FC', '#FEE0E2'):
              if color not in design:
                  problems.append(f'design system missing requested Home date tone {color}')

          shared = Path('src/components/ShiftMateUI.tsx').read_text()
          for primitive in ('BrandScreenHeader', 'SectionHeader', 'SurfaceCard', 'ShiftTypeBadge', 'HousePill'):
              if f'function {primitive}' not in shared:
                  problems.append(f'shared primitive missing: {primitive}')

          direct_hex = []
          hex_pattern = re.compile(r'#[0-9A-Fa-f]{6}')
          for path in visible_files:
              hits = sorted(set(hex_pattern.findall(path.read_text())))
              if hits:
                  direct_hex.append((str(path), hits))
          print('Direct screen/component hex colours (review list):')
          if direct_hex:
              for path, hits in direct_hex:
                  print(f'  {path}: {", ".join(hits)}')
          else:
              print('  none')

          if problems:
              print('UI AUDIT FAILED')
              for problem in problems:
                  print(' -', problem)
              raise SystemExit(1)
          print('UI AUDIT PASSED')
