name: Unify ShiftMate tab screen headers

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Replace duplicate tab headers with shared header
        shell: python
        run: |
          from pathlib import Path

          # Calendar
          path = Path('frontend/app/(tabs)/calendar.tsx')
          text = path.read_text()
          text = text.replace(
              'import { ShiftTypeBadge, HousePill } from "@/src/components/ShiftMateUI";',
              'import { BrandScreenHeader, ShiftTypeBadge, HousePill } from "@/src/components/ShiftMateUI";',
              1,
          )
          old = '''        <View style={styles.brandRow}>
          <View style={styles.brandLockup}>
            <View style={styles.logoMark}><Icon name="heart" size={22} color={colors.onBrandPrimary} /></View>
            <View>
              <Text style={styles.brandSmall}>ShiftMate</Text>
              <Text style={styles.screenTitle}>Calendar</Text>
            </View>
          </View>
          <Pressable onPress={() => router.push("/shift/new?date=" + selected)} style={styles.addCircle} testID="calendar-add-shift">
            <Icon name="add" size={24} color={colors.onBrandPrimary} />
          </Pressable>
        </View>'''
          new = '''        <BrandScreenHeader
          title="Calendar"
          trailing={
            <Pressable onPress={() => router.push("/shift/new?date=" + selected)} style={styles.addCircle} testID="calendar-add-shift">
              <Icon name="add" size={24} color={colors.onBrandPrimary} />
            </Pressable>
          }
        />'''
          if old not in text:
              raise SystemExit('Calendar header block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Scan
          path = Path('frontend/app/(tabs)/scan.tsx')
          text = path.read_text()
          anchor = 'import { Pressable } from "@/src/components/FeedbackPressable";\n'
          shared = 'import { BrandScreenHeader } from "@/src/components/ShiftMateUI";\n'
          if shared not in text:
              if anchor not in text:
                  raise SystemExit('Scan import anchor not found')
              text = text.replace(anchor, anchor + shared, 1)
          old = '''        <View style={styles.brandRow}>
          <View style={styles.logoMark}><Icon name="heart" size={22} color={colors.onBrandPrimary} /></View>
          <View style={{ flex: 1 }}><Text style={styles.brandSmall}>ShiftMate</Text><Text style={styles.title}>Scan roster</Text><Text style={styles.subtitle}>Read, review and save only the shifts you want.</Text></View>
          <Pressable testID="scan-payslip-btn" onPress={() => router.push("/payslip")} style={styles.payslipShortcut}>
            <Icon name="receipt-outline" size={17} color={colors.brand} />
            <Text style={styles.payslipShortcutText}>Payslip</Text>
          </Pressable>
        </View>'''
          new = '''        <BrandScreenHeader
          title="Scan roster"
          subtitle="Read, review and save only the shifts you want."
          trailing={
            <Pressable testID="scan-payslip-btn" onPress={() => router.push("/payslip")} style={styles.payslipShortcut}>
              <Icon name="receipt-outline" size={17} color={colors.brand} />
              <Text style={styles.payslipShortcutText}>Payslip</Text>
            </Pressable>
          }
        />'''
          if old not in text:
              raise SystemExit('Scan header block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Settings
          path = Path('frontend/app/(tabs)/settings.tsx')
          text = path.read_text()
          text = text.replace(
              'import { SectionHeader } from "@/src/components/ShiftMateUI";',
              'import { BrandScreenHeader, SectionHeader } from "@/src/components/ShiftMateUI";',
              1,
          )
          old = '''        <View style={styles.brandRow}>
          <View style={styles.logoMark}><Icon name="heart" size={22} color={colors.onBrandPrimary} /></View>
          <View style={{ flex: 1 }}><Text style={styles.brandSmall}>ShiftMate</Text><Text style={styles.title}>Settings</Text></View>
        </View>'''
          if old not in text:
              raise SystemExit('Settings header block not found')
          text = text.replace(old, '        <BrandScreenHeader title="Settings" />', 1)
          path.write_text(text)

      - name: Check patch
        run: git diff --check
      - name: Commit shared headers
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app
          git commit -m "Use shared headers across tab screens"
          git push origin HEAD:shiftmate-clean
