name: Wire shared ShiftMate visual primitives

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Wire shared visual primitives
        shell: python
        run: |
          from pathlib import Path
          import re

          # HOME — central shift badge and house pill.
          home_path = Path('frontend/app/(tabs)/index.tsx')
          home = home_path.read_text()
          home_import = 'import { ShiftTypeBadge, HousePill } from "@/src/components/ShiftMateUI";\n'
          if home_import not in home:
              anchor = 'import { Pressable } from "@/src/components/FeedbackPressable";\n'
              if anchor not in home:
                  raise SystemExit('Home import anchor missing')
              home = home.replace(anchor, anchor + home_import, 1)

          old_badge = '''                        <View style={[styles.shiftTypeBadge, { backgroundColor: night ? nightSurface : daySurface }]}>
                          <Icon name={night ? "moon" : "sunny"} size={styles.iconBadge.width as number} color={night ? nightAccent : dayAccent} />
                          <Text allowFontScaling={false} style={[styles.shiftTypeText, { color: night ? nightAccent : dayAccent }]} numberOfLines={1}>
                            {night ? "Night shift" : "Day shift"}
                          </Text>
                        </View>'''
          if old_badge not in home:
              raise SystemExit('Home badge block missing')
          home = home.replace(old_badge, '                        <ShiftTypeBadge night={night} />', 1)

          old_house = '''                      <View style={[styles.housePill, { backgroundColor: houseSurface }]}>
                        <Icon name="home" size={styles.iconHouse.width as number} color={houseAccent} />
                        <Text allowFontScaling={false} style={[styles.houseText, { color: houseAccent }]} numberOfLines={1}>{houseName}</Text>
                      </View>'''
          if old_house not in home:
              raise SystemExit('Home house pill block missing')
          home = home.replace(old_house, '                      <HousePill name={houseName} />', 1)
          for line in (
            '  const daySurface = visual.daySurface;\n',
            '  const dayAccent = visual.dayAccent;\n',
            '  const nightSurface = visual.nightSurface;\n',
            '  const houseSurface = visual.houseSurface;\n',
            '  const houseAccent = visual.houseAccent;\n',
          ):
              home = home.replace(line, '')
          # nightAccent still drives the timeline node.
          home_path.write_text(home)

          # CALENDAR — same shift visuals as Home.
          calendar_path = Path('frontend/app/(tabs)/calendar.tsx')
          cal = calendar_path.read_text()
          cal_import = 'import { ShiftTypeBadge, HousePill } from "@/src/components/ShiftMateUI";\n'
          if cal_import not in cal:
              anchor = 'import { Pressable } from "@/src/components/FeedbackPressable";\n'
              if anchor not in cal:
                  raise SystemExit('Calendar import anchor missing')
              cal = cal.replace(anchor, anchor + cal_import, 1)

          old_cal_house = '<View style={[styles.housePill, { backgroundColor: houseSurface }]}><Icon name="home" size={13} color={houseAccent} /><Text style={[styles.houseText, { color: houseAccent }]} numberOfLines={1}>{s.house_name || "No location"}</Text></View>'
          old_cal_kind = '''<View style={[styles.kindPill, { backgroundColor: shiftSurface }]}>
                  <Icon name={night ? "moon" : "sunny"} size={11} color={shiftAccent} />
                  <Text style={[styles.kindText, { color: shiftAccent }]}>{night ? "Night" : "Day"}</Text>
                </View>'''
          if old_cal_house not in cal or old_cal_kind not in cal:
              raise SystemExit('Calendar shared-pill blocks missing')
          cal = cal.replace(old_cal_house, '<HousePill name={s.house_name || "No location"} compact />', 1)
          cal = cal.replace(old_cal_kind, '<ShiftTypeBadge night={night} compact />', 1)
          cal = re.sub(
              r'          const shiftSurface = useMockupLight\n            \? \(night \? visual\.nightSurface : visual\.daySurface\)\n            : \(night \? colors\.brandTertiary : colors\.successSurface\);\n'
              r'          const shiftAccent = useMockupLight\n            \? \(night \? visual\.nightAccent : visual\.dayAccent\)\n            : \(night \? colors\.brand : colors\.success\);\n'
              r'          const houseSurface = useMockupLight \? visual\.houseSurface : colors\.brandTertiary;\n'
              r'          const houseAccent = useMockupLight \? visual\.houseAccent : colors\.brand;\n',
              '', cal, count=1
          )
          calendar_path.write_text(cal)

          # SETTINGS — replace the page-local section-heading implementation.
          settings_path = Path('frontend/app/(tabs)/settings.tsx')
          settings = settings_path.read_text()
          settings_import = 'import { SectionHeader } from "@/src/components/ShiftMateUI";\n'
          if settings_import not in settings:
              anchor = 'import { Pressable } from "@/src/components/FeedbackPressable";\n'
              if anchor not in settings:
                  raise SystemExit('Settings import anchor missing')
              settings = settings.replace(anchor, anchor + settings_import, 1)

          settings, removed = re.subn(
              r'\nfunction SectionTitle\([\s\S]*?\n}\n\nexport default function SettingsScreen\(\) \{',
              '\nexport default function SettingsScreen() {',
              settings,
              count=1,
          )
          if removed != 1:
              raise SystemExit('Could not remove local Settings SectionTitle')
          settings = settings.replace('<SectionTitle ', '<SectionHeader ')
          settings = settings.replace(' colors={colors} styles={styles} />', ' />')
          settings_path.write_text(settings)

      - name: Check patch
        run: git diff --check
      - name: Commit primitive wiring
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app
          git commit -m "Wire shared ShiftMate visual primitives"
          git push origin HEAD:shiftmate-clean
