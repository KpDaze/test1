name: Unify ShiftMate tab screen headers

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Replace duplicate tab headers with shared header
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label):
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label} header block match count: {count}')
              return text

          # Calendar
          path = Path('frontend/app/(tabs)/calendar.tsx')
          text = path.read_text()
          text = text.replace(
              'import { ShiftTypeBadge, HousePill } from "@/src/components/ShiftMateUI";',
              'import { BrandScreenHeader, ShiftTypeBadge, HousePill } from "@/src/components/ShiftMateUI";',
              1,
          )
          header = (
              '        <BrandScreenHeader\n'
              '          title="Calendar"\n'
              '          trailing={\n'
              '            <Pressable onPress={() => router.push("/shift/new?date=" + selected)} style={styles.addCircle} testID="calendar-add-shift">\n'
              '              <Icon name="add" size={24} color={colors.onBrandPrimary} />\n'
              '            </Pressable>\n'
              '          }\n'
              '        />'
          )
          text = sub_once(
              text,
              r'        <View style=\{styles\.brandRow\}>[\s\S]*?\n        </View>\n\n(?=        <View style=\{styles\.calendarCard\})',
              header + '\n\n',
              'Calendar',
          )
          path.write_text(text)

          # Scan
          path = Path('frontend/app/(tabs)/scan.tsx')
          text = path.read_text()
          anchor = 'import { Pressable } from "@/src/components/FeedbackPressable";\n'
          shared = 'import { BrandScreenHeader } from "@/src/components/ShiftMateUI";\n'
          if shared not in text:
              if anchor not in text:
                  raise SystemExit('Scan import anchor not found')
              text = text.replace(anchor, anchor + shared, 1)
          header = (
              '        <BrandScreenHeader\n'
              '          title="Scan roster"\n'
              '          subtitle="Read, review and save only the shifts you want."\n'
              '          trailing={\n'
              '            <Pressable testID="scan-payslip-btn" onPress={() => router.push("/payslip")} style={styles.payslipShortcut}>\n'
              '              <Icon name="receipt-outline" size={17} color={colors.brand} />\n'
              '              <Text style={styles.payslipShortcutText}>Payslip</Text>\n'
              '            </Pressable>\n'
              '          }\n'
              '        />'
          )
          text = sub_once(
              text,
              r'        <View style=\{styles\.brandRow\}>[\s\S]*?\n        </View>\n\n(?=        <View style=\{styles\.progressCard\})',
              header + '\n\n',
              'Scan',
          )
          path.write_text(text)

          # Settings
          path = Path('frontend/app/(tabs)/settings.tsx')
          text = path.read_text()
          text = text.replace(
              'import { SectionHeader } from "@/src/components/ShiftMateUI";',
              'import { BrandScreenHeader, SectionHeader } from "@/src/components/ShiftMateUI";',
              1,
          )
          text = sub_once(
              text,
              r'        <View style=\{styles\.brandRow\}>[\s\S]*?\n        </View>\n\n(?=        <SectionHeader icon="person-outline")',
              '        <BrandScreenHeader title="Settings" />\n\n',
              'Settings',
          )
          path.write_text(text)

      - name: Check patch
        run: git diff --check
      - name: Commit shared headers
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app
          git commit -m "Use shared headers across tab screens"
          git push origin HEAD:shiftmate-clean
