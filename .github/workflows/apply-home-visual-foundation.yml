name: Apply exact ShiftMate Home branding

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Replace reconstructed Home wordmark with reference asset
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/app/(tabs)/index.tsx')
          text = path.read_text()

          if '  Image,\n' not in text:
              text = text.replace('  ActivityIndicator,\n', '  ActivityIndicator,\n  Image,\n', 1)

          pattern = r'          <View style=\{styles\.brandLockup\}>[\s\S]*?\n          </View>\n\n(?=          <View style=\{styles\.headerActions\}>)'
          replacement = (
              '          <View style={styles.brandLockup}>\n'
              '            <Image\n'
              '              source={require("../../assets/shiftmate-brand.png")}\n'
              '              style={styles.brandLogo}\n'
              '              resizeMode="contain"\n'
              '              accessibilityLabel="ShiftMate — Supporting Brighter Days"\n'
              '            />\n'
              '          </View>\n\n'
          )
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Home brand block match count: {count}')

          style_anchor = '    brandLockup: { flexDirection: "row", alignItems: "center", flexShrink: 1 },\n'
          brand_style = '    brandLogo: { width: 198, height: 44 },\n'
          if brand_style not in text:
              if style_anchor not in text:
                  raise SystemExit('Home brand style anchor not found')
              text = text.replace(style_anchor, style_anchor + brand_style, 1)

          if 'shiftmate-brand.png' not in text:
              raise SystemExit('Reference brand asset was not wired')
          path.write_text(text)

      - name: Check patch
        run: git diff --check
      - name: Commit exact Home branding
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/'(tabs)'/index.tsx
          git commit -m "Use exact ShiftMate Home brand artwork"
          git push origin HEAD:shiftmate-clean
