name: Restore canonical ShiftMate Home branding

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Restore canonical mark and wordmark
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/app/(tabs)/index.tsx')
          text = path.read_text()

          anchor = 'type HomeLayout = {\n  compact: boolean;\n  veryCompact: boolean;\n};\n\n'
          brand_const = 'const BRAND_MARK = require("../../assets/branding/shiftmate-mark-source.png");\n\n'
          if brand_const not in text:
              if anchor not in text:
                  raise SystemExit('Home layout anchor not found')
              text = text.replace(anchor, anchor + brand_const, 1)

          pattern = r'          <View style=\{styles\.brandLockup\}>[\s\S]*?\n          </View>\n\n(?=          <View style=\{styles\.headerActions\}>)'
          replacement = (
              '          <View style={styles.brandLockup}>\n'
              '            <Image source={BRAND_MARK} style={styles.brandMark} resizeMode="contain" />\n'
              '            <View style={styles.brandTextBlock}>\n'
              '              <Text allowFontScaling={false} style={styles.brandName}>\n'
              '                <Text style={styles.brandNameShift}>Shift</Text>\n'
              '                <Text style={styles.brandNameMate}>Mate</Text>\n'
              '              </Text>\n'
              '              <Text allowFontScaling={false} style={styles.brandTagline}>SUPPORTING BRIGHTER DAYS</Text>\n'
              '            </View>\n'
              '          </View>\n\n'
          )
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Home brand block match count: {count}')

          text = text.replace('    brandLogo: { width: 198, height: 44 },\n', '')

          if 'shiftmate-brand.png' in text:
              raise SystemExit('Screenshot-derived brand asset is still referenced')
          if 'BRAND_MARK' not in text:
              raise SystemExit('Canonical ShiftMate mark is not wired')
          path.write_text(text)

      - name: Check patch
        run: git diff --check
      - name: Commit restored Home branding
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/'(tabs)'/index.tsx
          git commit -m "Restore canonical ShiftMate Home branding"
          git push origin HEAD:shiftmate-clean
