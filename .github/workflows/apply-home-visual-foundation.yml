name: Apply shared sizing and geometry roles

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Apply shared sizing and geometry roles
        shell: python
        run: |
          from pathlib import Path
          import re

          design_path = Path('frontend/src/designSystem.ts')
          design = design_path.read_text()
          anchor = '  brandMarkSize: 44,\n'
          additions = (
              '  cardPadding: 16,\n'
              '  compactCardPadding: 12,\n'
              '  roomyCardPadding: 20,\n'
              '  controlHeight: 44,\n'
              '  buttonHeight: 44,\n'
          )
          if 'cardPadding:' not in design:
              if design.count(anchor) != 1:
                  raise SystemExit('Could not locate component-token insertion point')
              design = design.replace(anchor, anchor + additions, 1)
              design_path.write_text(design)

          files = [
            Path('frontend/app/(tabs)/index.tsx'),
            Path('frontend/app/(tabs)/calendar.tsx'),
            Path('frontend/app/(tabs)/scan.tsx'),
            Path('frontend/app/(tabs)/settings.tsx'),
            Path('frontend/app/payslip.tsx'),
            Path('frontend/app/shift/[id].tsx'),
            Path('frontend/app/onboarding.tsx'),
          ]

          large_cards = {
            'payCard','calendarCard','heroCard','card','compareCard','manualCard','summaryCard','alarmCard','emptyCard'
          }
          compact_cards = {
            'shiftCard','fortnightCard','adjustmentCard','houseCard','themeOption','detectedCard','voiceCard','noticeCard','imageCard'
          }
          controls = {
            'input','notesInput','dateInput','timeInput','selector','timePickerButton','rateRow','anchorButton',
            'primarySmall','primaryButton','secondaryButton','primaryWide','primaryAction','secondaryAction','actionButton',
            'clearButton','clearHalf','primaryHalf','saveButton','changeButton'
          }
          button_keys = {
            'primarySmall','primaryButton','secondaryButton','primaryWide','primaryAction','secondaryAction','actionButton',
            'clearButton','clearHalf','primaryHalf','saveButton','changeButton','payslipShortcut'
          }

          def ensure_design_import(text: str):
              m = re.search(r'import \{([^}]*)\} from "@/src/designSystem";', text)
              if m:
                  names = [n.strip() for n in m.group(1).split(',') if n.strip()]
                  for name in ('layoutTokens','componentTokens'):
                      if name not in names:
                          names.append(name)
                  repl = 'import { ' + ', '.join(names) + ' } from "@/src/designSystem";'
                  return text[:m.start()] + repl + text[m.end():]
              theme_match = re.search(r'import \{[^}]*\} from "@/src/theme";\n', text)
              if not theme_match:
                  raise SystemExit('Could not anchor design-system import')
              return text[:theme_match.end()] + 'import { layoutTokens, componentTokens } from "@/src/designSystem";\n' + text[theme_match.end():]

          total = 0
          for path in files:
              text = path.read_text()
              original = text
              # Standard screen horizontal rhythm for main content/footer shells.
              text = text.replace('paddingHorizontal: 20', 'paddingHorizontal: layoutTokens.screenPadding')

              out = []
              for line in text.splitlines():
                  m = re.match(r'^(\s*)([A-Za-z0-9_]+): \{(.*)\},\s*$', line)
                  if not m:
                      out.append(line)
                      continue
                  indent, key, body = m.group(1), m.group(2), m.group(3)
                  updated = body
                  if key in large_cards:
                      updated = re.sub(r'borderRadius:\s*\d+(?:\.\d+)?', 'borderRadius: componentTokens.cardRadius', updated)
                  elif key in compact_cards:
                      updated = re.sub(r'borderRadius:\s*\d+(?:\.\d+)?', 'borderRadius: componentTokens.compactCardRadius', updated)
                  elif key in controls:
                      updated = re.sub(r'borderRadius:\s*\d+(?:\.\d+)?', 'borderRadius: componentTokens.controlRadius', updated)
                  if key == 'dateTile':
                      updated = re.sub(r'borderRadius:\s*\d+(?:\.\d+)?', 'borderRadius: componentTokens.dateTileRadius', updated)
                  if key == 'logoMark':
                      updated = re.sub(r'width:\s*44', 'width: componentTokens.brandMarkSize', updated)
                      updated = re.sub(r'height:\s*44', 'height: componentTokens.brandMarkSize', updated)
                      updated = re.sub(r'borderRadius:\s*15', 'borderRadius: componentTokens.compactCardRadius', updated)
                  if key in button_keys and 'minHeight:' not in updated and 'height:' not in updated:
                      updated = updated.rstrip() + ', minHeight: layoutTokens.touchTarget'
                  if updated != body:
                      total += 1
                      line = f'{indent}{key}: {{ {updated} }},'
                  out.append(line)
              text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
              if text != original:
                  text = ensure_design_import(text)
                  path.write_text(text)
                  print('Geometry:', path)

          if total < 20:
              raise SystemExit(f'Expected broad geometry migration; changed only {total} style roles')
          print('Total geometry roles migrated:', total)

      - name: Check patch
        run: git diff --check
      - name: Commit geometry migration
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/designSystem.ts frontend/app
          git commit -m "Apply shared sizing and geometry across ShiftMate"
          git push origin HEAD:shiftmate-clean
