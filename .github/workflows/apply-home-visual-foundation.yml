name: Wire shared ShiftMate visual primitives

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Wire shared visual primitives
        shell: python
        run: |
          from pathlib import Path
          import re

          def add_import(text: str, anchor: str, new_import: str, label: str):
              if new_import in text:
                  return text
              if anchor not in text:
                  raise SystemExit(f'{label} import anchor missing')
              return text.replace(anchor, anchor + new_import, 1)

          # HOME
          home_path = Path('frontend/app/(tabs)/index.tsx')
          home = home_path.read_text()
          home = add_import(
              home,
              'import { Pressable } from "@/src/components/FeedbackPressable";\n',
              'import { ShiftTypeBadge, HousePill } from "@/src/components/ShiftMateUI";\n',
              'Home',
          )
          home, n_badge = re.subn(
              r'<View style=\{\[styles\.shiftTypeBadge, \{ backgroundColor: night \? nightSurface : daySurface \}\]\}>[\s\S]*?</View>',
              '<ShiftTypeBadge night={night} />',
              home,
              count=1,
          )
          home, n_house = re.subn(
              r'<View style=\{\[styles\.housePill, \{ backgroundColor: houseSurface \}\]\}>[\s\S]*?</View>',
              '<HousePill name={houseName} />',
              home,
              count=1,
          )
          if n_badge != 1 or n_house != 1:
              raise SystemExit(f'Home primitive matches badge={n_badge} house={n_house}')
          for line in (
              '  const daySurface = visual.daySurface;\n',
              '  const dayAccent = visual.dayAccent;\n',
              '  const nightSurface = visual.nightSurface;\n',
              '  const houseSurface = visual.houseSurface;\n',
              '  const houseAccent = visual.houseAccent;\n',
          ):
              home = home.replace(line, '')
          home_path.write_text(home)

          # CALENDAR
          cal_path = Path('frontend/app/(tabs)/calendar.tsx')
          cal = cal_path.read_text()
          cal = add_import(
              cal,
              'import { Pressable } from "@/src/components/FeedbackPressable";\n',
              'import { ShiftTypeBadge, HousePill } from "@/src/components/ShiftMateUI";\n',
              'Calendar',
          )
          cal, n_house = re.subn(
              r'<View style=\{\[styles\.housePill, \{ backgroundColor: houseSurface \}\]\}>[\s\S]*?</View>',
              '<HousePill name={s.house_name || "No location"} compact />',
              cal,
              count=1,
          )
          cal, n_kind = re.subn(
              r'<View style=\{\[styles\.kindPill, \{ backgroundColor: shiftSurface \}\]\}>[\s\S]*?</View>',
              '<ShiftTypeBadge night={night} compact />',
              cal,
              count=1,
          )
          if n_house != 1 or n_kind != 1:
              raise SystemExit(f'Calendar primitive matches house={n_house} kind={n_kind}')
          cal = re.sub(r'\n\s*const shiftSurface = useMockupLight[\s\S]*?const houseAccent = useMockupLight \? visual\.houseAccent : colors\.brand;\n', '\n', cal, count=1)
          cal_path.write_text(cal)

          # SETTINGS
          settings_path = Path('frontend/app/(tabs)/settings.tsx')
          settings = settings_path.read_text()
          settings = add_import(
              settings,
              'import { Pressable } from "@/src/components/FeedbackPressable";\n',
              'import { SectionHeader } from "@/src/components/ShiftMateUI";\n',
              'Settings',
          )
          settings, removed = re.subn(
              r'\nfunction SectionTitle\([\s\S]*?\n}\n\nexport default function SettingsScreen\(\) \{',
              '\nexport default function SettingsScreen() {',
              settings,
              count=1,
          )
          if removed != 1:
              raise SystemExit('Could not remove local Settings SectionTitle')
          settings = settings.replace('<SectionTitle ', '<SectionHeader ')
          settings = settings.replace(' colors={colors} styles={styles} />', ' />')
          if '<SectionTitle ' in settings:
              raise SystemExit('Settings still contains local SectionTitle usage')
          settings_path.write_text(settings)

      - name: Check patch
        run: git diff --check
      - name: Commit primitive wiring
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app
          git commit -m "Wire shared ShiftMate visual primitives"
          git push origin HEAD:shiftmate-clean
