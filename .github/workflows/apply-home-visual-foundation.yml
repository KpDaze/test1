name: Apply shared typography roles

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Apply shared typography roles
        shell: python
        run: |
          from pathlib import Path
          import re

          theme_path = Path('frontend/src/theme.ts')
          theme = theme_path.read_text()
          anchor = '  label: { fontSize: 11, lineHeight: 14, fontWeight: "800" as const },\n'
          extra = (
              '  itemTitle: { fontSize: 14, lineHeight: 18, fontWeight: "800" as const },\n'
              '  sectionTitleCompact: { fontSize: 18, lineHeight: 22, fontWeight: "900" as const, letterSpacing: -0.2 },\n'
              '  button: { fontSize: 13, lineHeight: 17, fontWeight: "800" as const },\n'
              '  caption: { fontSize: 10, lineHeight: 14, fontWeight: "400" as const },\n'
              '  micro: { fontSize: 9, lineHeight: 12, fontWeight: "700" as const },\n'
              '  inputStrong: { fontSize: 13, lineHeight: 17, fontWeight: "800" as const },\n'
          )
          if 'sectionTitleCompact:' not in theme:
              if theme.count(anchor) != 1:
                  raise SystemExit('Could not locate type-scale insertion point')
              theme = theme.replace(anchor, anchor + extra, 1)
              theme_path.write_text(theme)

          # style key -> (typeScale role, font family role)
          file_roles = {
            'frontend/app/(tabs)/calendar.tsx': {
              'brandSmall': ('eyebrow','textBold'), 'screenTitle': ('screenTitle','displayBold'),
              'monthTitle': ('statValue','displayBold'), 'swipeHint': ('caption','text'),
              'weekDay': ('micro','textBold'), 'cellText': ('body','textMedium'),
              'eyebrow': ('eyebrow','textBold'), 'selectedTitle': ('sectionTitle','displayBold'),
              'selectedDate': ('bodySmall','text'), 'countText': ('label','textBold'),
              'fortnightLabel': ('eyebrow','textBold'), 'fortnightRange': ('itemTitle','textBold'),
              'fortnightHint': ('caption','text'), 'emptyTitle': ('cardTitle','displayBold'),
              'emptyText': ('bodySmall','text'), 'primaryButtonText': ('action','textBold'),
              'shiftTime': ('shiftTime','displayBold'), 'duration': ('duration','textMedium'),
              'houseText': ('house','textMedium'), 'kindText': ('badge','textMedium'),
              'alarmText': ('metadata','text'),
            },
            'frontend/app/(tabs)/scan.tsx': {
              'brandSmall': ('eyebrow','textBold'), 'title': ('screenTitle','displayBold'),
              'subtitle': ('bodySmall','text'), 'payslipShortcutText': ('action','textBold'),
              'stepNumber': ('micro','textBold'), 'stepLabel': ('micro','textMedium'),
              'heroTitle': ('sectionTitle','displayBold'), 'heroText': ('bodySmall','text'),
              'primaryActionText': ('button','textBold'), 'secondaryActionText': ('button','textBold'),
              'eyebrow': ('eyebrow','textBold'), 'cardTitle': ('cardTitle','displayBold'),
              'changeText': ('action','textBold'), 'noticeTitle': ('label','textBold'),
              'noticeText': ('bodySmall','text'), 'reviewTitle': ('sectionTitle','displayBold'),
              'selectedCount': ('cardTitle','displayBold'), 'selectedText': ('micro','textBold'),
              'weekday': ('dateWeekday','textBold'), 'dateInput': ('inputStrong','textMedium'),
              'confidenceText': ('micro','textBold'), 'fieldLabel': ('eyebrow','textBold'),
              'timeInput': ('statValue','displayBold'), 'houseText': ('badge','textMedium'),
              'nonShift': ('itemTitle','textBold'), 'rawText': ('bodySmall','text'),
              'warningText': ('caption','text'), 'footerCount': ('sectionTitle','displayBold'),
              'footerLabel': ('micro','textBold'), 'saveButtonText': ('button','textBold'),
            },
            'frontend/app/(tabs)/settings.tsx': {
              'brandSmall': ('eyebrow','textBold'), 'title': ('screenTitle','displayBold'),
              'sectionTitle': ('sectionTitleCompact','displayBold'), 'sectionSubtitle': ('bodySmall','text'),
              'label': ('label','textBold'), 'subLabel': ('label','textBold'),
              'help': ('bodySmall','text'), 'helpNoTop': ('bodySmall','text'), 'helpCompact': ('caption','text'),
              'input': ('input','text'), 'primarySmallText': ('action','textBold'),
              'segmentText': ('action','textMedium'), 'dowText': ('label','textBold'),
              'anchorText': ('itemTitle','textMedium'), 'stepText': ('micro','textBold'),
              'reminderTitle': ('itemTitle','textBold'), 'secondaryButtonText': ('action','textBold'),
              'primaryButtonText': ('action','textBold'), 'statusText': ('bodySmall','text'),
              'currency': ('statValue','displayBold'), 'rateInput': ('input','text'),
              'rateSuffix': ('action','textMedium'), 'houseName': ('itemTitle','textBold'),
              'houseAddress': ('caption','text'), 'houseRate': ('label','textBold'),
              'defaultText': ('micro','textBold'), 'toggleTitle': ('itemTitle','textBold'),
              'themeName': ('label','textBold'), 'themeDescription': ('micro','text'),
            },
            'frontend/app/payslip.tsx': {
              'brandSmall': ('eyebrow','textBold'), 'title': ('screenTitle','displayBold'),
              'heroTitle': ('itemTitle','textBold'), 'heroText': ('caption','text'),
              'actionText': ('action','textBold'), 'noticeTitle': ('label','textBold'),
              'noticeText': ('caption','text'), 'detectedTitle': ('itemTitle','textBold'),
              'detectedRange': ('caption','text'), 'hoursPillText': ('label','textBold'),
              'sectionTitle': ('sectionTitleCompact','displayBold'), 'statLabel': ('micro','textBold'),
              'statValue': ('shiftTime','displayBold'), 'comparedRange': ('micro','text'),
              'infoText': ('micro','text'), 'differenceLabel': ('label','textBold'),
              'differenceValue': ('statValue','displayBold'), 'help': ('caption','text'),
              'helpNoTop': ('caption','text'), 'adjustmentDate': ('itemTitle','textBold'),
              'statusText': ('micro','textBold'), 'miniValue': ('cardTitle','displayBold'),
              'clearText': ('action','textBold'), 'primaryText': ('action','textBold'),
            },
            'frontend/app/shift/[id].tsx': {
              'brandSmall': ('eyebrow','textBold'), 'title': ('screenTitle','displayBold'),
              'summaryDate': ('micro','textBold'), 'summaryTime': ('statValue','displayBold'),
              'summaryHouse': ('label','textBold'), 'eyebrow': ('eyebrow','textBold'),
              'cardTitle': ('cardTitle','displayBold'), 'help': ('caption','text'),
              'messageText': ('bodySmall','text'), 'transcript': ('caption','text'),
              'selectorText': ('shiftTime','displayBold'), 'fieldLabel': ('eyebrow','textBold'),
              'timePickerText': ('statValue','displayBold'), 'switchInputMode': ('micro','textBold'),
              'countText': ('label','textBold'), 'historyDotText': ('micro','textBold'),
              'historyTitle': ('micro','textBold'), 'historyText': ('bodySmall','text'),
              'historyStamp': ('micro','text'), 'notesInput': ('input','text'),
              'saveText': ('button','textBold'),
            },
            'frontend/app/onboarding.tsx': {
              'brandName': ('wordmark','displayBold'), 'tagline': ('micro','textBold'),
              'stepText': ('eyebrow','textBold'), 'title': ('screenTitle','displayBold'),
              'subtitle': ('body','text'), 'cardEyebrow': ('eyebrow','textBold'),
              'cardTitle': ('cardTitle','displayBold'), 'label': ('label','textBold'),
              'input': ('input','text'), 'primaryText': ('button','textBold'),
              'backText': ('action','textBold'), 'localText': ('caption','text'),
            },
          }

          font_props = re.compile(r'(?:fontSize|lineHeight|fontWeight|letterSpacing):\s*[^,}]+,?\s*')

          def ensure_theme_import(text: str):
              m = re.search(r'import \{([^}]*)\} from "@/src/theme";', text)
              if not m:
                  raise SystemExit('Missing theme import')
              names = [n.strip() for n in m.group(1).split(',') if n.strip()]
              for name in ('fonts', 'typeScale'):
                  if name not in names:
                      names.append(name)
              replacement = 'import { ' + ', '.join(names) + ' } from "@/src/theme";'
              return text[:m.start()] + replacement + text[m.end():]

          total = 0
          for filename, roles in file_roles.items():
              path = Path(filename)
              text = path.read_text()
              lines = text.splitlines()
              changed = 0
              out = []
              for line in lines:
                  m = re.match(r'^(\s*)([A-Za-z0-9_]+): \{(.*)\},\s*$', line)
                  if m and m.group(2) in roles and re.search(r'font(?:Size|Weight)|lineHeight|letterSpacing', m.group(3)):
                      indent, key, body = m.group(1), m.group(2), m.group(3)
                      role, family = roles[key]
                      body = font_props.sub('', body).strip()
                      body = re.sub(r'^,\s*|,\s*$', '', body).strip()
                      prefix = f'fontFamily: fonts.{family}, ...typeScale.{role}'
                      body = f'{prefix}, {body}' if body else prefix
                      line = f'{indent}{key}: {{ {body} }},'
                      changed += 1
                  out.append(line)
              if changed:
                  text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
                  text = ensure_theme_import(text)
                  path.write_text(text)
                  print(f'{filename}: {changed} typography roles')
                  total += changed

          if total < 50:
              raise SystemExit(f'Expected broad typography migration; changed only {total} style roles')
          print('Total typography roles migrated:', total)

      - name: Check patch
        run: git diff --check
      - name: Commit typography migration
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/theme.ts frontend/app
          git commit -m "Apply shared typography roles across ShiftMate"
          git push origin HEAD:shiftmate-clean
