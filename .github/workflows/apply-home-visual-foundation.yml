name: Apply app-wide semantic colour migration

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/apply-home-visual-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
      - name: Migrate mock-up colour usage to shared design roles
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [Path('frontend/app'), Path('frontend/src/components')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob('*.tsx'))

          mapping = {
              'background': 'page',
              'nearWhite': 'card',
              'coolPale': 'cardMuted',
              'paleBlueGrey': 'divider',
              'paleAqua': 'accentSurface',
              'teal': 'accent',
              'activeTeal': 'accentStrong',
              'tealMid': 'accentMid',
              'steelBlue': 'steel',
              'navy': 'text',
              'navyDeep': 'textStrong',
              'navyDarkest': 'textDeep',
              'muted': 'muted',
              'mutedSoft': 'mutedSoft',
              'daySurface': 'daySurface',
              'dayAccent': 'dayAccent',
              'nightSurface': 'nightSurface',
              'nightAccent': 'nightAccent',
              'houseSurface': 'houseSurface',
              'houseAccent': 'houseAccent',
              'red': 'danger',
              'yellow': 'warning',
          }

          changed = []
          for path in files:
              text = path.read_text()
              if 'MOCKUP_LIGHT.' not in text:
                  continue

              original = text
              for source, target in mapping.items():
                  text = text.replace(f'MOCKUP_LIGHT.{source}', f'visual.{target}')

              if 'MOCKUP_LIGHT.' in text:
                  raise SystemExit(f'Unhandled MOCKUP_LIGHT role in {path}')

              # Remove the direct mock-up palette import.
              text = re.sub(r'^import \{ MOCKUP_LIGHT \} from "@/src/mockupPalette";\n', '', text, flags=re.M)

              # useDesignSystem is a superset of useTheme, so screens retain all existing theme controls.
              if 'useDesignSystem()' not in text:
                  text = text.replace('useTheme()', 'useDesignSystem()')

              if 'useDesignSystem' not in text.split('\n', 30)[0:30]:
                  pass

              if 'from "@/src/designSystem"' not in text:
                  theme_import = re.search(r'^import \{([^}]*)\} from "@/src/theme";\n', text, flags=re.M)
                  if theme_import:
                      names = [n.strip() for n in theme_import.group(1).split(',') if n.strip() and n.strip() != 'useTheme']
                      replacement = f'import {{ {", ".join(names)} }} from "@/src/theme";\nimport {{ useDesignSystem }} from "@/src/designSystem";\n'
                      text = text[:theme_import.start()] + replacement + text[theme_import.end():]
                  else:
                      # No named theme import to anchor against; add alongside the other imports.
                      first_blank = text.find('\n\n')
                      text = text[:first_blank] + '\nimport { useDesignSystem } from "@/src/designSystem";' + text[first_blank:]
              else:
                  # Remove useTheme from an existing theme import when the design hook replaced it.
                  def clean_theme_import(match):
                      names = [n.strip() for n in match.group(1).split(',') if n.strip() and n.strip() != 'useTheme']
                      return f'import {{ {", ".join(names)} }} from "@/src/theme";'
                  text = re.sub(r'import \{([^}]*)\} from "@/src/theme";', clean_theme_import, text, count=1)

              # Add visual to the first design-system destructuring if needed.
              def add_visual(match):
                  body = match.group(1)
                  names = [n.strip() for n in body.split(',') if n.strip()]
                  if 'visual' not in names:
                      names.append('visual')
                  return 'const { ' + ', '.join(names) + ' } = useDesignSystem();'
              text, count = re.subn(r'const \{([^}]*)\} = useDesignSystem\(\);', add_visual, text, count=1)
              if count == 0:
                  raise SystemExit(f'Could not locate design-system hook destructuring in {path}')

              path.write_text(text)
              changed.append(str(path))

          if not changed:
              raise SystemExit('No files required semantic colour migration')

          print('Migrated semantic colours in:')
          for path in changed:
              print(' -', path)

          # App/screens/components must now consume shared roles instead of direct MOCKUP_LIGHT imports.
          offenders = []
          for root in roots:
              for path in root.rglob('*.tsx'):
                  if 'MOCKUP_LIGHT' in path.read_text():
                      offenders.append(str(path))
          if offenders:
              raise SystemExit('Direct MOCKUP_LIGHT usage remains: ' + ', '.join(offenders))

      - name: Check patch
        run: git diff --check
      - name: Commit semantic colour migration
        run: |
          git config user.name "ShiftMate UI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app frontend/src/components
          git commit -m "Migrate screens to shared semantic colours"
          git push origin HEAD:shiftmate-clean
