name: Public runner probe

on:
  push:
    branches:
      - shiftmate-clean
    paths:
      - .github/workflows/public-runner-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm public runner allocation
        run: echo "public runner allocated"
