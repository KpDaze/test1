name: ShiftMate empty Home runtime screenshot

on:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/shiftmate-runtime-empty-home.yml

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled ShiftMate APK
        uses: actions/download-artifact@v4
        with:
          name: ShiftMate-release-current
          path: apk
          github-token: ${{ github.token }}
          repository: KpDaze/test1
          run-id: 34743652308
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch clean Home, and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell wm size 941x1672
            adb shell wm density 350
            adb shell settings put system font_scale 1.0
            adb shell settings put system time_12_24 24
            adb install -r apk/app-release.apk
            adb shell am force-stop com.shiftmate.app
            adb shell am start -W -a android.intent.action.VIEW -d 'shiftmate:///(tabs)' com.shiftmate.app || true
            sleep 8
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb exec-out screencap -p > shiftmate-home-empty.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ShiftMate-empty-home-screenshot
          path: shiftmate-home-empty.png
          if-no-files-found: error
          retention-days: 3
