name: ShiftMate live interactive emulator

on:
  workflow_dispatch:
  push:
    branches: [shiftmate-clean]
    paths:
      - .github/workflows/shiftmate-live-emulator.yml

permissions:
  contents: write

concurrency:
  group: shiftmate-live-interactive
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiftmate-clean
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Build x86_64 debug app for live reload
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace --no-daemon
        working-directory: frontend/android
      - name: Build isolated live sample database
        run: python3 .live/make_seed.py
        working-directory: .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .
      - name: Run live ShiftMate emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: bash .live/run-live-emulator.sh
