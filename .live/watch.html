<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ShiftMate Live</title>
<style>
html,body{height:100%;margin:0;background:#071419;color:#eef7f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{height:100%;display:grid;place-items:center;padding:24px}.card{max-width:520px;width:100%;background:#0d2027;border:1px solid #21414a;border-radius:22px;padding:24px;text-align:center}.pulse{width:16px;height:16px;border-radius:50%;background:#41a299;margin:0 auto 18px;box-shadow:0 0 0 0 rgba(65,162,153,.55);animation:p 1.3s infinite}@keyframes p{70%{box-shadow:0 0 0 18px rgba(65,162,153,0)}100%{box-shadow:0 0 0 0 rgba(65,162,153,0)}}h1{font-size:24px;margin:0 0 10px}p{color:#a9bcc1;line-height:1.45;margin:0}.err{color:#ff9b9b;margin-top:12px;font-size:13px}</style>
</head>
<body><div class="wrap"><div class="card"><div class="pulse"></div><h1>Starting the live ShiftMate Android session</h1><p>This page will open the actual running emulator automatically as soon as the live tunnel is ready.</p><div id="err" class="err"></div></div></div>
<script>
const feed='https://raw.githubusercontent.com/KpDaze/test1/shiftmate-clean/.live/LIVE_URL';
async function check(){
  try{
    const r=await fetch(feed+'?t='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const u=(await r.text()).trim();
      if(/^https:\/\/[-a-z0-9.]+\.trycloudflare\.com\/?$/i.test(u)){location.replace(u);return;}
    }
    document.getElementById('err').textContent='';
  }catch(e){document.getElementById('err').textContent='Waiting for the live runner…';}
  setTimeout(check,1500);
}
check();
</script></body></html>
